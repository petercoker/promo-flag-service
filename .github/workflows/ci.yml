# GitHub Actions CI Pipeline
# Automated delivery pipeline for the Promo Feature Flag Service
#
# Triggers on every push to main/dev branches and all pull requests.
# Runs TypeScript validation, linting, and Vitest integration tests.

name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# Prevent concurrent runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CACHE_KEY_PREFIX: promo-flag-service-v2

jobs:
  # ---------------------------------------------------------------------------
  # Build & Validate Job
  # ---------------------------------------------------------------------------
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ env.CACHE_KEY_PREFIX }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: TypeScript structural validation
        run: npx tsc --noEmit
        env:
          CI: true

      - name: Verify ESM import paths
        run: |
          echo "Checking for missing .js extensions in imports..."
          if grep -r "from ['\"]\.\?\.\/.*['\"]" src/ --include="*.ts" | grep -v "\.js['\"]" | grep -v "node_modules"; then
            echo "ERROR: Found relative imports without .js extension"
            exit 1
          fi
          echo "All imports use correct .js extension"

  # ---------------------------------------------------------------------------
  # Test Job
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ env.CACHE_KEY_PREFIX }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm run test
        env:
          CI: true
          NODE_ENV: test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Security Scan Job
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit fix (dry run)
        run: npm audit fix --dry-run

  # ---------------------------------------------------------------------------
  # Pipeline Summary
  # ---------------------------------------------------------------------------
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [validate, test, security]
    if: always()

    steps:
      - name: Check pipeline status
        run: |
          echo "=== Pipeline Summary ==="
          echo "Validate: ${{ needs.validate.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Pipeline FAILED - tests did not pass"
            exit 1
          fi

          echo "Pipeline PASSED - all required checks succeeded"
